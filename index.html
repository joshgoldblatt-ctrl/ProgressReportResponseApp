  App:          LaGuardia Faculty Progress Report Response App

  CHANGELOG (most recent first)
--------------------------------------------------------------------------------
  v3.2  2026-05-11
    - Added new course prefix mappings: IND -> Other, SGN -> NAS, SSI -> SOC SCI
    - Added CMF and SYF to FYS department (previously unmapped / mapped to SOC SCI)
    - FYS courses now count in BOTH the FYS department AND their home department:
      BTF->BAT, CJF->SOC SCI, CSF->MEC, ECF->MEC, EDF->ELA, ENF->ENG, FAF->HUM,
      HAF->HUM, HSF->HLT SCI, IDF->HUM, LIF->LIBARTS, LMF->LIBARTS, MRF->HUM,
      NSF->NAS, CMF->HUM, SYF->SOC SCI
    - Refactored getDepartment() to getDepartments() returning an array, and
      processCSV() to loop over multiple departments per row for department-level
      stats while keeping overview stats counted once per row
  v3.1  2026-05-11
    - Export All Depts PDF now downloads as a single .zip file instead of
      triggering individual file saves, using JSZip library for compression
    - Added "Export All Non-Respondents CSV" button that bundles all per-department
      non-respondent CSVs into a single .zip file for batch download
    - Refactored exportDepartmentToPDF() and exportNonRespondentsCSV() to support
      dual mode: direct download for individual use, or return blob/content for
      zip bundling
  v3.0  2026-05-11
    - Migrated to standardized app metadata, header, and file naming conventions
    - Added "Export All Departments" button on Faculty Detail tab: batch-generates
      all individual department PDFs at once instead of selecting one at a time
    - Added "Export Non-Respondents CSV" per-department dropdown on Faculty Detail
      tab: exports a CSV of faculty who completed 0 progress reports, including
      their email address, for follow-up outreach purposes
    - Began capturing "Professor Requested  Email" (two-space column header) from
      CSV during data processing and storing it in facultyDepartmentStats
  v2.8  2026-02-10
    - Added PDF export for Course Analysis tab (both "Export All" for all
      departments in one PDF and per-department dropdown)
  v2.7  2026-02-10
    - Fixed CSF course prefix mapping: was incorrectly mapped to ELA, now
      correctly maps to FYS (First Year Seminar) department
  v2.6
    - Previous version (pre-migration baseline)
================================================================================
-->

            'NSF': 'NAS',
            'CMF': 'HUM',
            'SYF': 'SOC SCI'
        };

        let processedData = null;

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const fileInfo = document.getElementById('fileInfo');
        const tabsContainer = document.getElementById('tabsContainer');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                showError('Please upload a CSV file');
                return;
            }

            progressContainer.style.display = 'block';
            fileInfo.style.display = 'none';

            const reader = new FileReader();
            const fileSize = file.size;
            let loaded = 0;

            reader.onprogress = (e) => {
                if (e.lengthComputable) {
                    loaded = e.loaded;
                    const percentComplete = Math.round((loaded / fileSize) * 100);
                    progressFill.style.width = percentComplete + '%';
                    progressFill.textContent = percentComplete + '%';
                }
            };

            reader.onload = (e) => {
                progressFill.style.width = '100%';
                progressFill.textContent = 'Processing...';
                
                setTimeout(() => {
                    try {
                        const csvData = e.target.result;
                        processCSV(csvData);
                        showSuccess(`Successfully processed ${file.name}`);
                        tabsContainer.style.display = 'block';
                        progressContainer.style.display = 'none';
                    } catch (error) {
                        showError('Error processing file: ' + error.message);
                        progressContainer.style.display = 'none';
                    }
                }, 100);
            };

            reader.onerror = () => {
                showError('Error reading file');
                progressContainer.style.display = 'none';
            };

            reader.readAsText(file);
        }

        function showError(message) {
            fileInfo.textContent = message;
            fileInfo.className = 'file-info error';
            fileInfo.style.display = 'block';
        }

        function showSuccess(message) {
            fileInfo.textContent = message;
            fileInfo.className = 'file-info';
            fileInfo.style.display = 'block';
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = [];
            const data = [];
            
            // Parse headers
            let headerLine = lines[0];
            let inQuote = false;
            let field = '';
            
            for (let i = 0; i < headerLine.length; i++) {
                const char = headerLine[i];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === ',' && !inQuote) {
                    headers.push(field.trim());
                    field = '';
                } else {
                    field += char;
                }
            }
            headers.push(field.trim());
            
            // Parse data rows
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const row = {};
                let field = '';
                let fieldIndex = 0;
                let inQuote = false;
                
                for (let j = 0; j < lines[i].length; j++) {
                    const char = lines[i][j];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row[headers[fieldIndex]] = field.trim();
                        field = '';
                        fieldIndex++;
                    } else {
                        field += char;
                    }
                }
                row[headers[fieldIndex]] = field.trim();
                data.push(row);
            }
            
            return data;
        }

        function getDepartments(courseNumber) {
            const prefix = courseNumber.split('-')[0];
            const primaryDept = DEPT_MAPPING[prefix] || 'Unknown';
            const departments = [primaryDept];
            
            // If this is an FYS course, also add the home department
            if (primaryDept === 'FYS' && FYS_HOME_DEPT[prefix]) {
                departments.push(FYS_HOME_DEPT[prefix]);
            }
            
            return departments;
        }

        function processCSV(csvContent) {
            const data = parseCSV(csvContent);
            
            // Process the data
            const students = new Set();
            const facultyMap = new Map();
            const facultyDepartmentStats = new Map(); // Track faculty stats per department
            const departmentStats = new Map();
            const courseStats = new Map();

            data.forEach(row => {
                if (!row['Student ID'] || !row['Professor Requested ID']) return;
                
                students.add(row['Student ID']);
                
                const facultyId = row['Professor Requested ID'];
                const facultyName = row['Professor Requested Name'];
                const facultyEmail = row['Professor Requested  Email'] || '';
                const courseNumber = row['Course Number'];
                const courseName = row['Course Name'];
                const responded = row['Responded'] === 'Yes';
                const departments = getDepartments(courseNumber);

                // Track overall faculty stats (for overview) - count once per row
                if (!facultyMap.has(facultyId)) {
                    facultyMap.set(facultyId, {
                        name: facultyName,
                        departments: new Set(),
                        reportsSent: 0,
                        reportsCompleted: 0,
                        courses: new Set()
                    });
                }
                const faculty = facultyMap.get(facultyId);
                departments.forEach(dept => faculty.departments.add(dept));
                faculty.reportsSent++;
                if (responded) faculty.reportsCompleted++;
                faculty.courses.add(courseNumber);

                // For each department this course belongs to, track department-level stats
                departments.forEach(department => {
                    // Track faculty stats per department (for department views)
                    const facultyDeptKey = `${facultyId}|${department}`;
                    if (!facultyDepartmentStats.has(facultyDeptKey)) {
                        facultyDepartmentStats.set(facultyDeptKey, {
                            facultyId: facultyId,
                            name: facultyName,
                            email: facultyEmail,
                            department: department,
                            reportsSent: 0,
                            reportsCompleted: 0
                        });
                    }
                    const facultyDept = facultyDepartmentStats.get(facultyDeptKey);
                    facultyDept.reportsSent++;
                    if (responded) facultyDept.reportsCompleted++;
                    // Update email if we didn't have it before
                    if (!facultyDept.email && facultyEmail) facultyDept.email = facultyEmail;

                    // Track department stats
                    if (!departmentStats.has(department)) {
                        departmentStats.set(department, {
                            facultyIds: new Set(),
                            facultyCompleted: new Set(),
                            totalReports: 0,
                            completedReports: 0
                        });
                    }
                    const deptStat = departmentStats.get(department);
                    deptStat.facultyIds.add(facultyId);
                    deptStat.totalReports++;
                    if (responded) {
                        deptStat.completedReports++;
                    }
                    
                    // Check if this faculty has completed ANY reports in this department
                    if (facultyDept.reportsCompleted > 0) {
                        deptStat.facultyCompleted.add(facultyId);
                    }

                    // Track course stats
                    const courseKey = `${department}|${courseNumber}|${courseName}`;
                    if (!courseStats.has(courseKey)) {
                        courseStats.set(courseKey, {
                            department: department,
                            courseNumber: courseNumber,
                            courseName: courseName,
                            reportsSent: 0,
                            reportsCompleted: 0
                        });
                    }
                    const courseStat = courseStats.get(courseKey);
                    courseStat.reportsSent++;
                    if (responded) courseStat.reportsCompleted++;
                });
            });

            // Calculate total faculty who completed at least one report
            let totalFacultyCompleted = 0;
            facultyMap.forEach(faculty => {
                if (faculty.reportsCompleted > 0) totalFacultyCompleted++;
            });

            processedData = {
                students: students,
                facultyMap: facultyMap,
                facultyDepartmentStats: facultyDepartmentStats,
                departmentStats: departmentStats,
                courseStats: courseStats,
                totalStudents: students.size,
                totalFaculty: facultyMap.size,
                totalFacultyCompleted: totalFacultyCompleted
            };

            renderOverview();
            renderFacultyDetail();
            renderCourseAnalysis();
        }

        function sortTable(header) {
            const table = header.closest('table');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const column = header.dataset.column;
            const isNumeric = ['sent', 'completed', 'percentage'].includes(column);
            
            // Determine sort direction
            const isAscending = header.classList.contains('sorted-asc');
            
            // Remove sorted classes from all headers
            table.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
            });
            
            // Add appropriate class to clicked header
            header.classList.add(isAscending ? 'sorted-desc' : 'sorted-asc');
            
            // Sort rows
            rows.sort((a, b) => {
                let aValue = a.dataset[column];
                let bValue = b.dataset[column];
                
                if (isNumeric) {
                    aValue = parseFloat(aValue) || 0;
                    bValue = parseFloat(bValue) || 0;
                } else {
                    aValue = aValue.toLowerCase();
                    bValue = bValue.toLowerCase();
                }
                
                if (aValue < bValue) return isAscending ? 1 : -1;
                if (aValue > bValue) return isAscending ? -1 : 1;
                return 0;
            });
            
            // Reorder rows
            rows.forEach(row => tbody.appendChild(row));
        }

        function exportDepartmentToPDF(department, returnBlob) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Get current date
            const currentDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            // Add title
            doc.setFontSize(20);
            doc.text(`Faculty Response for ${department}`, 105, 20, { align: 'center' });
            
            // Add date and name
            doc.setFontSize(10);
            doc.text(currentDate, 105, 30, { align: 'center' });
            doc.text('Josh Goldblatt, Academic Affairs', 105, 36, { align: 'center' });
            
            // Get faculty data for the department from facultyDepartmentStats
            const facultyList = [];
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                if (faculty.department === department) {
                    facultyList.push(faculty);
                }
            });
            
            // Sort faculty by name
            facultyList.sort((a, b) => a.name.localeCompare(b.name));
            
            // Add department statistics
            const deptStats = processedData.departmentStats.get(department);
            const facultyCount = deptStats ? deptStats.facultyIds.size : facultyList.length;
            const facultyParticipated = deptStats ? deptStats.facultyCompleted.size : 0;
            const deptRate = ((facultyParticipated/facultyCount)*100).toFixed(1);
            
            doc.setFontSize(12);
            let yPos = 50;
            doc.text(`Total Faculty: ${facultyCount}`, 20, yPos);
            doc.text(`Faculty Participated: ${facultyParticipated}`, 80, yPos);
            doc.text(`Participation Rate: ${deptRate}%`, 140, yPos);
            
            // Prepare table data - Sort by participation first (Yes first), then by name
            const tableData = [];
            
            // Separate faculty into participated and not participated
            const participatedFaculty = [];
            const notParticipatedFaculty = [];
            
            facultyList.forEach(faculty => {
                const percentage = faculty.reportsSent > 0 
                    ? ((faculty.reportsCompleted / faculty.reportsSent) * 100).toFixed(1)
                    : '0.0';
                const participated = faculty.reportsCompleted > 0;
                
                const rowData = {
                    name: faculty.name,
                    reportsSent: faculty.reportsSent.toString(),
                    reportsCompleted: faculty.reportsCompleted.toString(),
                    percentage: `${percentage}%`,
                    participated: participated
                };
                
                if (participated) {
                    participatedFaculty.push(rowData);
                } else {
                    notParticipatedFaculty.push(rowData);
                }
            });
            
            // Sort each group by name
            participatedFaculty.sort((a, b) => a.name.localeCompare(b.name));
            notParticipatedFaculty.sort((a, b) => a.name.localeCompare(b.name));
            
            // Combine groups (participated first) and create table data
            const sortedFaculty = [...participatedFaculty, ...notParticipatedFaculty];
            sortedFaculty.forEach(faculty => {
                tableData.push([
                    faculty.name,
                    faculty.reportsSent,
                    faculty.reportsCompleted,
                    faculty.percentage,
                    faculty.participated ? 'Yes' : 'No'
                ]);
            });
            
            // Add faculty table with color coding for participation column
            yPos += 15;
            doc.autoTable({
                startY: yPos,
                head: [['Faculty Name', 'Reports Sent', 'Reports Completed', 'Reports Completed %', 'Participated?']],
                body: tableData,
                theme: 'striped',
                headStyles: { 
                    fillColor: [102, 126, 234],
                    fontSize: 10,
                    fontStyle: 'bold',
                    halign: 'left'
                },
                bodyStyles: {
                    fontSize: 9
                },
                columnStyles: {
                    0: { cellWidth: 60 },
                    1: { cellWidth: 30, halign: 'center' },
                    2: { cellWidth: 35, halign: 'center' },
                    3: { cellWidth: 30, halign: 'center' },
                    4: { cellWidth: 30, halign: 'center' }
                },
                didDrawCell: function(data) {
                    // Color code the Participated column (column index 4)
                    if (data.column.index === 4 && data.section === 'body') {
                        const text = data.cell.text[0];
                        if (text === 'Yes') {
                            doc.setTextColor(34, 139, 34); // Green color
                        } else if (text === 'No') {
                            doc.setTextColor(220, 53, 69); // Red color
                        }
                        // Redraw the text with color
                        doc.text(text, data.cell.x + data.cell.width / 2, data.cell.y + data.cell.height / 2, {
                            align: 'center',
                            baseline: 'middle'
                        });
                    }
                },
                margin: { left: 20, right: 20 }
            });
            
            // If returnBlob is true, return the PDF as a blob for zipping
            if (returnBlob) {
                return doc.output('blob');
            }

            // Otherwise save the PDF directly
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;
            const deptName = department.replace(/\s+/g, '_');
            doc.save(`Progress Report Participation_${deptName}_${dateStr}.pdf`);
        }

        function exportAllDepartmentsPDF() {
            // Get all departments
            const departments = new Set();
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                departments.add(faculty.department);
            });
            const sortedDepts = Array.from(departments).sort();

            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;

            // Create zip file with all department PDFs
            const zip = new JSZip();
            sortedDepts.forEach(dept => {
                const pdfBlob = exportDepartmentToPDF(dept, true);
                const deptName = dept.replace(/\s+/g, '_');
                zip.file(`Progress Report Participation_${deptName}_${dateStr}.pdf`, pdfBlob);
            });

            zip.generateAsync({ type: 'blob' }).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Progress Report All Departments_${dateStr}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
            });
        }

        function exportNonRespondentsCSV(department, returnContent) {
            // Get faculty in this department who completed 0 reports
            const nonRespondents = [];
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                if (faculty.department === department && faculty.reportsCompleted === 0) {
                    nonRespondents.push(faculty);
                }
            });

            // Sort by name
            nonRespondents.sort((a, b) => a.name.localeCompare(b.name));

            if (nonRespondents.length === 0) {
                if (!returnContent) {
                    alert(`No non-respondents found for ${department}. All faculty in this department have completed at least one report.`);
                }
                return null;
            }

            // Build CSV content
            let csv = 'Faculty Name,Email,Department,Reports Sent\n';
            nonRespondents.forEach(faculty => {
                // Escape fields that might contain commas
                const name = `"${faculty.name.replace(/"/g, '""')}"`;
                const email = `"${(faculty.email || '').replace(/"/g, '""')}"`;
                const dept = `"${faculty.department.replace(/"/g, '""')}"`;
                csv += `${name},${email},${dept},${faculty.reportsSent}\n`;
            });

            // If returnContent is true, return CSV string for zipping
            if (returnContent) {
                return csv;
            }

            // Otherwise trigger direct download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;
            const deptName = department.replace(/\s+/g, '_');
            link.href = URL.createObjectURL(blob);
            link.download = `Non-Respondents_${deptName}_${dateStr}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function exportAllNonRespondentsCSV() {
            // Get all departments
            const departments = new Set();
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                departments.add(faculty.department);
            });
            const sortedDepts = Array.from(departments).sort();

            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;

            // Create zip file with all department CSVs
            const zip = new JSZip();
            let hasAny = false;
            sortedDepts.forEach(dept => {
                const csvContent = exportNonRespondentsCSV(dept, true);
                if (csvContent) {
                    const deptName = dept.replace(/\s+/g, '_');
                    zip.file(`Non-Respondents_${deptName}_${dateStr}.csv`, csvContent);
                    hasAny = true;
                }
            });

            if (!hasAny) {
                alert('No non-respondents found in any department. All faculty have completed at least one report.');
                return;
            }

            zip.generateAsync({ type: 'blob' }).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Non-Respondents All Departments_${dateStr}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
            });
        }
