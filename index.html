<!DOCTYPE html>
<!--
================================================================================
  App:          LaGuardia Faculty Progress Report Response App
  Version:      3.3
  Released:     July 27, 2026
  Developed by: Josh Goldblatt using Claude
================================================================================
  CHANGELOG (most recent first)
--------------------------------------------------------------------------------
  v3.3  2026-07-27
    - DEPARTMENT MODEL CHANGE: First Year Seminar courses no longer form their
      own "FYS" department. Each FYS course now counts ONLY in its home academic
      department, so every report maps to exactly one department. This removes
      the v3.2 dual-department counting, which inflated department report totals
      by 3,348 rows on the FA25 Session I file and listed 100 faculty in more
      than one department (now 40, all from genuinely cross-department teaching).
    - FYS is now a separate VIEW rather than a department: added a "First Year
      Seminar" summary block to the Overview tab and a dedicated FYS section at
      the top of both the Faculty Detail and Course Analysis tabs. FYS is also
      selectable in the department PDF and non-respondent CSV export dropdowns.
      Internally FYS is stored as a pseudo-department key so all existing export
      functions work against it unchanged; it is excluded from the Overview
      department summary table so its reports are never counted twice.
    - Corrected FYS prefix list per Josh (July 2026 review). ELF was removed from
      the FYS set: its courses are Elementary French I/II, not First Year
      Seminars. It was never in FYS_HOME_DEPT, so this is a clarification only.
      CSF remains MEC (First Year Seminar for Computer Science).
    - Added course prefix mappings: ELZ -> ELA (Elementary Portuguese; previously
      unmapped and surfacing as an "Unknown" department with 16 reports),
      HPF -> HLT SCI (First Year Seminar prefix, not yet present in exports).
    - Refactored getDepartments() (array) back to getDepartment() (single value)
      plus a separate isFYSCourse() test, since a course now has exactly one
      department. processCSV() accumulates the FYS pseudo-department alongside
      the real one instead of looping over a department array.
    - NEW: "Export Tableau CSV" on the Overview tab, producing a Tableau-ready
      file at one row per report (no duplication) for the Progress Report
      participation workbook. Semester and Session are auto-derived from the
      Campaign Name column (e.g. "FA25 - Session I" -> FA25 / Session I) into
      editable fields, and drive the filename
      <SEMESTER>_<SESSION>_progress_reports_clean.csv. Files are intended for a
      single OneDrive folder read by a wildcard union, one file per session.
    - Export carries precomputed faculty-level participation flags (department,
      FYS, and overall) so the Tableau workbook does not need LOD calculations,
      plus Section Name, Responded Date, and How Many Notifications Sent.
  v3.2  2026-05-11
    - Added new course prefix mappings: IND -> Other, SGN -> NAS, SSI -> SOC SCI
    - Added CMF and SYF to FYS department (previously unmapped / mapped to SOC SCI)
    - FYS courses now count in BOTH the FYS department AND their home department:
      BTF->BAT, CJF->SOC SCI, CSF->MEC, ECF->MEC, EDF->ELA, ENF->ENG, FAF->HUM,
      HAF->HUM, HSF->HLT SCI, IDF->HUM, LIF->LIBARTS, LMF->LIBARTS, MRF->HUM,
      NSF->NAS, CMF->HUM, SYF->SOC SCI
    - Refactored getDepartment() to getDepartments() returning an array, and
      processCSV() to loop over multiple departments per row for department-level
      stats while keeping overview stats counted once per row
  v3.1  2026-05-11
    - Export All Depts PDF now downloads as a single .zip file instead of
      triggering individual file saves, using JSZip library for compression
    - Added "Export All Non-Respondents CSV" button that bundles all per-department
      non-respondent CSVs into a single .zip file for batch download
    - Refactored exportDepartmentToPDF() and exportNonRespondentsCSV() to support
      dual mode: direct download for individual use, or return blob/content for
      zip bundling
  v3.0  2026-05-11
    - Migrated to standardized app metadata, header, and file naming conventions
    - Added "Export All Departments" button on Faculty Detail tab: batch-generates
      all individual department PDFs at once instead of selecting one at a time
    - Added "Export Non-Respondents CSV" per-department dropdown on Faculty Detail
      tab: exports a CSV of faculty who completed 0 progress reports, including
      their email address, for follow-up outreach purposes
    - Began capturing "Professor Requested  Email" (two-space column header) from
      CSV during data processing and storing it in facultyDepartmentStats
  v2.8  2026-02-10
    - Added PDF export for Course Analysis tab (both "Export All" for all
      departments in one PDF and per-department dropdown)
  v2.7  2026-02-10
    - Fixed CSF course prefix mapping: was incorrectly mapped to ELA, now
      correctly maps to FYS (First Year Seminar) department
  v2.6
    - Previous version (pre-migration baseline)
================================================================================
-->

        .stat-subvalue {

        table {

        }

        }

        td {

        }

        tbody tr:hover {

        }

        tbody tr:last-child td {

        }

        .percentage {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .percentage.high {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .percentage.medium {
            background: #fff3e0;
            color: #f57c00;
        }

        .percentage.low {
            background: #ffebee;
            color: #c62828;
        }

        .department-section {
            margin-bottom: 20px;
        }

        .department-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            display: flex;

        .department-header:hover {

        .department-header.expanded {

        .department-name {

            font-weight: 600;
            color: #495057;
            display: flex;
            align-items: center;

        }

        .expand-icon {

            gap: 20px;
        }

            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;

        .department-content.expanded {
            max-height: 5000px;
            opacity: 1;
        }

        .department-export-container {

            overflow-y: auto;

            display: none;
        }

        .department-dropdown.show {
            display: block;
        }

        .department-dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .department-dropdown-item:last-child {
            border-bottom: none;
        }

        .department-dropdown-item:hover {
            background: #f8f9fa;
        }

        /* --- v3.3: First Year Seminar view + Tableau export --- */
        .department-section.fys-section .department-header {
            background: #e8f6f8;
            border-left: 4px solid #17a2b8;
        }
        .fys-summary {
            background: #e8f6f8;
            border-left: 4px solid #17a2b8;
            border-radius: 8px;
            padding: 20px 25px;
            margin-top: 30px;
        }
        .fys-summary h3 {
            color: #0f6674;
            margin-bottom: 6px;
        }
        .fys-summary .fys-note {
            color: #4a6b70;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .fys-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .fys-metric {
            background: white;
            border-radius: 6px;
            padding: 15px;
        }
        .fys-metric-label {
            color: #6c757d;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .fys-metric-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #0f6674;
        }
        .tableau-export-bar {
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }
        .tableau-export-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .tableau-export-field label {
            font-size: 0.8em;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tableau-export-field input {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
            width: 150px;
        }
        .tableau-export-field input:focus {
            outline: none;
            border-color: #667eea;
        }
        .tableau-export-hint {
            flex: 1 1 100%;
            color: #6c757d;
            font-size: 0.85em;
        }
        .tableau-export-hint code {
            background: #eef0f5;
            padding: 2px 6px;
            border-radius: 4px;
            color: #495057;
        }
        .department-dropdown-header {
            padding: 10px 15px;
            font-weight: 600;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 LaGuardia Faculty Progress Report Response App</h1>
            <div class="subtitle">Version 3.3 — Released July 27, 2026</div>
            <div class="subtitle">Developed by Josh Goldblatt using Claude</div>
        </div>

        <div class="upload-section">
            <div class="file-upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Click to upload or drag and drop</div>
                <div class="upload-subtext">CSV files only</div>
                <input type="file" class="file-input" id="fileInput" accept=".csv">
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
            </div>
            
            <div class="file-info" id="fileInfo"></div>
        </div>

        <div class="tabs-container" id="tabsContainer">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('overview', this)">📈 Overview Dashboard</button>
                <button class="tab" onclick="switchTab('faculty', this)">👥 Faculty Detail</button>
                <button class="tab" onclick="switchTab('courses', this)">📚 Course Analysis</button>
            </div>

            <div class="tab-content active" id="overview">
                <!-- Overview content will be generated here -->
            </div>

            <div class="tab-content" id="faculty">
                <!-- Faculty content will be generated here -->
            </div>

            <div class="tab-content" id="courses">
                <!-- Course content will be generated here -->
            </div>
        </div>
    </div>

    <script>
        // Department mapping data embedded in the app
        const DEPT_MAPPING = {
            'BTA': 'BAT',
            'BTC': 'BAT',
            'BTI': 'BAT',
            'BTM': 'BAT',
            'BTO': 'BAT',
            'BTP': 'BAT',
            'BTT': 'BAT',
            'HSS': 'COMM HLT',
            'HTR': 'COMM HLT',
            'SCD': 'COMM HLT',
            'SCH': 'COMM HLT',
            'SCN': 'COMM HLT',
            'SSN': 'SOC SCI',  // Mapped to SOC SCI with other SS prefixes
            'CSE': 'ELA',
            'EIS': 'ELA',
            'ELA': 'ELA',
            'ELC': 'ELA',
            'ELE': 'ELA',
            'ELF': 'ELA',
            'ELI': 'ELA',
            'ELJ': 'ELA',
            'ELK': 'ELA',
            'ELL': 'ELA',
            'ELM': 'ELA',
            'ELN': 'ELA',
            'ELS': 'ELA',
            'ESA': 'ELA',
            'ESL': 'ELA',
            'ELZ': 'ELA',
            'ENA': 'ENG',
            'ENG': 'ENG',
            'ENN': 'ENG',

            // As of v3.3 FYS is not a department; it is a separate view driven
            // by FYS_PREFIXES below. Keep these two lists in sync.
            'BTF': 'BAT',
            'CJF': 'SOC SCI',
            'CMF': 'HUM',
            'CSF': 'MEC',
            'ECF': 'MEC',
            'EDF': 'ELA',
            'ENF': 'ENG',
            'FAF': 'HUM',
            'HAF': 'HUM',
            'HPF': 'HLT SCI',
            'HSF': 'HLT SCI',
            'IDF': 'HUM',
            'LIF': 'LIBARTS',
            'LMF': 'LIBARTS',
            'MRF': 'HUM',
            'NSF': 'NAS',
            'SYF': 'SOC SCI',
            // --- end First Year Seminar prefixes
            'SCL': 'HLT SCI',
            'SCO': 'HLT SCI',
            'SCR': 'HLT SCI',
            'SCT': 'HLT SCI',
            'SCV': 'HLT SCI',
            'SCX': 'HLT SCI',
            'HUA': 'HUM',
            'HUC': 'HUM',
            'HUI': 'HUM',
            'HUM': 'HUM',
            'HUN': 'HUM',
            'HUP': 'HUM',
            'HUT': 'HUM',
            'HUV': 'HUM',
            'HUW': 'HUM',
            'HUX': 'HUM',
            'LIB': 'LIBARTS',
            'LIN': 'LIBARTS',
            'MAC': 'MEC',
            'MAE': 'MEC',
            'MAT': 'MEC',
            'SCB': 'NAS',
            'SCC': 'NAS',
            'SCE': 'NAS',
            'SCG': 'NAS',
            'SCP': 'NAS',
            'ENX': 'Other',
            'FSG': 'Other',
            'IND': 'Other',
            'LRC': 'Other',
            'REG': 'Other',
            'SSA': 'SOC SCI',
            'SSE': 'SOC SCI',
            'SSH': 'SOC SCI',
            'SSI': 'SOC SCI',
            'SSJ': 'SOC SCI',
            'SSP': 'SOC SCI',
            'SSS': 'SOC SCI',
            'SSY': 'SOC SCI',
            'SGN': 'NAS'
        };

        // First Year Seminar course prefixes.
        // FYS is NOT a department (v3.3) - these courses count in their home
        // department in DEPT_MAPPING above. This set drives the separate FYS
        // view on the Overview, Faculty Detail, and Course Analysis tabs.
        // NOTE: ELF is deliberately absent - ELF courses are Elementary French,
        // not First Year Seminars, and belong to ELA as ordinary courses.
        const FYS_PREFIXES = new Set([
            'BTF', 'CJF', 'CMF', 'CSF', 'ECF', 'EDF', 'ENF', 'FAF', 'HAF',
            'HPF', 'HSF', 'IDF', 'LIF', 'LMF', 'MRF', 'NSF', 'SYF'
        ]);

        // Pseudo-department key holding FYS stats alongside the real departments,
        // so the existing per-department export functions work against it with no
        // special cases. It is excluded from the Overview department summary and
        // from any institution-wide total so FYS reports are never counted twice.
        const FYS_KEY = 'FYS (First Year Seminar)';

        let processedData = null;

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const fileInfo = document.getElementById('fileInfo');
        const tabsContainer = document.getElementById('tabsContainer');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                showError('Please upload a CSV file');
                return;
            }

            progressContainer.style.display = 'block';
            fileInfo.style.display = 'none';

            const reader = new FileReader();
            const fileSize = file.size;
            let loaded = 0;

            reader.onprogress = (e) => {
                if (e.lengthComputable) {
                    loaded = e.loaded;
                    const percentComplete = Math.round((loaded / fileSize) * 100);
                    progressFill.style.width = percentComplete + '%';
                    progressFill.textContent = percentComplete + '%';
                }
            };

            reader.onload = (e) => {
                progressFill.style.width = '100%';
                progressFill.textContent = 'Processing...';
                
                setTimeout(() => {
                    try {
                        const csvData = e.target.result;
                        processCSV(csvData);
                        showSuccess(`Successfully processed ${file.name}`);
                        tabsContainer.style.display = 'block';
                        progressContainer.style.display = 'none';
                    } catch (error) {
                        showError('Error processing file: ' + error.message);
                        progressContainer.style.display = 'none';
                    }
                }, 100);
            };

            reader.onerror = () => {
                showError('Error reading file');
                progressContainer.style.display = 'none';
            };

            reader.readAsText(file);
        }

        function showError(message) {
            fileInfo.textContent = message;
            fileInfo.className = 'file-info error';
            fileInfo.style.display = 'block';
        }

        function showSuccess(message) {
            fileInfo.textContent = message;
            fileInfo.className = 'file-info';
            fileInfo.style.display = 'block';
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = [];
            const data = [];
            
            // Parse headers
            let headerLine = lines[0];
            let inQuote = false;
            let field = '';
            
            for (let i = 0; i < headerLine.length; i++) {
                const char = headerLine[i];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === ',' && !inQuote) {
                    headers.push(field.trim());
                    field = '';
                } else {
                    field += char;
                }
            }
            headers.push(field.trim());
            
            // Parse data rows
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const row = {};
                let field = '';
                let fieldIndex = 0;
                let inQuote = false;
                
                for (let j = 0; j < lines[i].length; j++) {
                    const char = lines[i][j];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row[headers[fieldIndex]] = field.trim();
                        field = '';
                        fieldIndex++;
                    } else {
                        field += char;
                    }
                }
                row[headers[fieldIndex]] = field.trim();
                data.push(row);
            }
            
            return data;
        }

        function getCoursePrefix(courseNumber) {
            return (courseNumber || '').split('-')[0].trim().toUpperCase();
        }

        // As of v3.3 a course belongs to exactly ONE department. First Year
        // Seminar courses resolve to their home department via DEPT_MAPPING.
        function getDepartment(courseNumber) {
            return DEPT_MAPPING[getCoursePrefix(courseNumber)] || 'Unknown';
        }

        // FYS sorts to the top of any department list; real departments A-Z.
        function sortDepartmentKeys(keys) {
            return Array.from(keys).sort((a, b) => {
                if (a === FYS_KEY) return -1;
                if (b === FYS_KEY) return 1;
                return a.localeCompare(b);
            });
        }

        function isFYSCourse(courseNumber) {
            return FYS_PREFIXES.has(getCoursePrefix(courseNumber));
        }

        // Campaign Name looks like "FA25 - Session I " -> Semester FA25, Session "Session I".
        // Both values are shown in editable fields so an unexpected campaign name
        // can be corrected before exporting.
        function deriveSemesterSession(campaignName) {
            const raw = (campaignName || '').trim();
            const idx = raw.indexOf(' - ');
            if (idx > -1) {
                return { semester: raw.slice(0, idx).trim(), session: raw.slice(idx + 3).trim() };
            }
            return { semester: raw, session: '' };
        }

        function processCSV(csvContent) {
            const data = parseCSV(csvContent);
            
            // Process the data
            const students = new Set();
            const facultyMap = new Map();
            const facultyDepartmentStats = new Map(); // Track faculty stats per department
            const departmentStats = new Map();
            const courseStats = new Map();
            const exportRows = [];        // one entry per report, for the Tableau export
            const campaignNames = new Map();

            data.forEach(row => {
                if (!row['Student ID'] || !row['Professor Requested ID']) return;
                
                students.add(row['Student ID']);
                
                const facultyId = row['Professor Requested ID'];
                const facultyName = row['Professor Requested Name'];
                const facultyEmail = row['Professor Requested  Email'] || '';
                const courseNumber = row['Course Number'];
                const courseName = row['Course Name'];
                const responded = row['Responded'] === 'Yes';

                // v3.3: exactly one real department per row. FYS is tracked in
                // parallel under FYS_KEY so it can be viewed and exported
                // separately without being counted as a department.
                const department = getDepartment(courseNumber);
                const isFYS = isFYSCourse(courseNumber);
                const departments = isFYS ? [department, FYS_KEY] : [department];

                campaignNames.set(row['Campaign Name'] || '',
                    (campaignNames.get(row['Campaign Name'] || '') || 0) + 1);

                // Retained per-report detail for the Tableau export.
                exportRows.push({
                    campaignName: row['Campaign Name'] || '',
                    studentId: row['Student ID'],
                    facultyId: facultyId,
                    facultyName: facultyName,
                    facultyEmail: facultyEmail,
                    courseNumber: courseNumber,
                    courseName: courseName,
                    coursePrefix: getCoursePrefix(courseNumber),
                    sectionName: row['Section Name'] || '',
                    department: department,
                    isFYS: isFYS,
                    responded: responded,
                    respondedDate: row['Responded Date'] || '',
                    notifications: row['How Many Notifications Sent'] || ''
                });

                // Track overall faculty stats (for overview) - count once per row
                if (!facultyMap.has(facultyId)) {
                    facultyMap.set(facultyId, {
                        name: facultyName,
                        departments: new Set(),
                        reportsSent: 0,
                        reportsCompleted: 0,
                        courses: new Set()
                    });
                }
                const faculty = facultyMap.get(facultyId);
                faculty.departments.add(department);   // real department only
                faculty.reportsSent++;
                if (responded) faculty.reportsCompleted++;
                faculty.courses.add(courseNumber);

                // For each department this course belongs to, track department-level stats
                departments.forEach(department => {
                    // Track faculty stats per department (for department views)
                    const facultyDeptKey = `${facultyId}|${department}`;
                    if (!facultyDepartmentStats.has(facultyDeptKey)) {
                        facultyDepartmentStats.set(facultyDeptKey, {
                            facultyId: facultyId,
                            name: facultyName,
                            email: facultyEmail,
                            department: department,
                            reportsSent: 0,
                            reportsCompleted: 0
                        });
                    }
                    const facultyDept = facultyDepartmentStats.get(facultyDeptKey);
                    facultyDept.reportsSent++;
                    if (responded) facultyDept.reportsCompleted++;
                    // Update email if we didn't have it before
                    if (!facultyDept.email && facultyEmail) facultyDept.email = facultyEmail;

                    // Track department stats
                    if (!departmentStats.has(department)) {
                        departmentStats.set(department, {
                            facultyIds: new Set(),
                            facultyCompleted: new Set(),
                            totalReports: 0,
                            completedReports: 0
                        });
                    }
                    const deptStat = departmentStats.get(department);
                    deptStat.facultyIds.add(facultyId);
                    deptStat.totalReports++;
                    if (responded) {
                        deptStat.completedReports++;
                    }
                    
                    // Check if this faculty has completed ANY reports in this department
                    if (facultyDept.reportsCompleted > 0) {
                        deptStat.facultyCompleted.add(facultyId);
                    }

                    // Track course stats
                    const courseKey = `${department}|${courseNumber}|${courseName}`;
                    if (!courseStats.has(courseKey)) {
                        courseStats.set(courseKey, {
                            department: department,
                            courseNumber: courseNumber,
                            courseName: courseName,
                            reportsSent: 0,
                            reportsCompleted: 0
                        });
                    }
                    const courseStat = courseStats.get(courseKey);
                    courseStat.reportsSent++;
                    if (responded) courseStat.reportsCompleted++;
                });
            });

            // Calculate total faculty who completed at least one report
            let totalFacultyCompleted = 0;
            facultyMap.forEach(faculty => {
                if (faculty.reportsCompleted > 0) totalFacultyCompleted++;
            });

            // Most frequent campaign name drives the auto-filled Semester/Session.
            let topCampaign = '';
            let topCampaignCount = -1;
            campaignNames.forEach((count, name) => {
                if (count > topCampaignCount) { topCampaignCount = count; topCampaign = name; }
            });
            const derived = deriveSemesterSession(topCampaign);

            processedData = {
                students: students,
                facultyMap: facultyMap,
                facultyDepartmentStats: facultyDepartmentStats,
                departmentStats: departmentStats,
                courseStats: courseStats,
                totalStudents: students.size,
                totalFaculty: facultyMap.size,
                totalFacultyCompleted: totalFacultyCompleted,
                exportRows: exportRows,
                campaignName: topCampaign,
                campaignCount: campaignNames.size,
                semester: derived.semester,
                session: derived.session
            };

            renderOverview();
            renderFacultyDetail();
            renderCourseAnalysis();
        }

        function switchTab(tabName, element) {
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Add active class to clicked tab and corresponding content
            element.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function sortTable(header) {
            const table = header.closest('table');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const column = header.dataset.column;
            const isNumeric = ['sent', 'completed', 'percentage'].includes(column);
            
            // Determine sort direction
            const isAscending = header.classList.contains('sorted-asc');
            
            // Remove sorted classes from all headers
            table.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
            });
            
            // Add appropriate class to clicked header
            header.classList.add(isAscending ? 'sorted-desc' : 'sorted-asc');
            
            // Sort rows
            rows.sort((a, b) => {
                let aValue = a.dataset[column];
                let bValue = b.dataset[column];
                
                if (isNumeric) {
                    aValue = parseFloat(aValue) || 0;
                    bValue = parseFloat(bValue) || 0;
                } else {
                    aValue = aValue.toLowerCase();
                    bValue = bValue.toLowerCase();
                }
                
                if (aValue < bValue) return isAscending ? 1 : -1;
                if (aValue > bValue) return isAscending ? -1 : 1;
                return 0;
            });
            
            // Reorder rows
            rows.forEach(row => tbody.appendChild(row));
        }

        // PDF Export Functions
        // ---------------------------------------------------------------
        // Tableau export (v3.3)
        // One row per report - no department duplication - with faculty-level
        // participation flags precomputed so the workbook needs no LOD calcs.
        // ---------------------------------------------------------------

        // Keeps export filenames tidy for the FYS pseudo-department.
        function deptFileLabel(dept) {
            return dept === FYS_KEY ? 'FYS' : dept.replace(/\s+/g, '_');
        }

        function tableauFileName(semester, session) {
            const clean = v => (v || '').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            const parts = [clean(semester), clean(session)].filter(Boolean);
            return parts.join('_') + '_progress_reports_clean.csv';
        }

        function updateTableauHint() {
            const hint = document.getElementById('tableauHint');
            if (!hint || !processedData) return;

            const semester = (document.getElementById('exportSemester') || {}).value || '';
            const session = (document.getElementById('exportSession') || {}).value || '';
            const rows = processedData.exportRows.length.toLocaleString();

            let warning = '';
            if (processedData.campaignCount > 1) {
                warning = ` <strong style="color:#dc354d;">This file contains ${processedData.campaignCount} campaigns;
                            confirm the Semester and Session above.</strong>`;
            }

            hint.innerHTML = `Exports <code>${tableauFileName(semester, session)}</code> &mdash; ${rows} rows,
                              one per progress report. Auto-filled from Campaign Name
                              &ldquo;${processedData.campaignName.trim()}&rdquo;.${warning}`;
        }

        function csvCell(value) {
            const text = value === null || value === undefined ? '' : String(value);
            return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
        }

        function exportTableauCSV() {
            if (!processedData) return;

            const semester = (document.getElementById('exportSemester').value || '').trim();
            const session = (document.getElementById('exportSession').value || '').trim();

            if (!semester || !session) {
                alert('Please enter both a Semester (e.g. FA25) and a Session (e.g. Session I) before exporting.');
                return;
            }

            const headers = [
                'Semester', 'Session', 'Campaign Name', 'Student ID',
                'Professor ID', 'Professor Name', 'Professor Email',
                'Course Number', 'Course Name', 'Course Prefix', 'Section Name',
                'Academic Department', 'Is FYS Course',
                'Responded', 'Responded Flag', 'Responded Date', 'How Many Notifications Sent',
                'Faculty Reports Sent in Dept', 'Faculty Reports Completed in Dept', 'Faculty Participated in Dept',
                'Faculty Reports Sent in FYS', 'Faculty Reports Completed in FYS', 'Faculty Participated in FYS',
                'Faculty Reports Sent Overall', 'Faculty Reports Completed Overall', 'Faculty Participated Overall'
            ];

            const lines = [headers.join(',')];

            processedData.exportRows.forEach(row => {
                const deptStat = processedData.facultyDepartmentStats.get(`${row.facultyId}|${row.department}`);
                const fysStat = processedData.facultyDepartmentStats.get(`${row.facultyId}|${FYS_KEY}`);
                const overall = processedData.facultyMap.get(row.facultyId);

                const deptSent = deptStat ? deptStat.reportsSent : 0;
                const deptDone = deptStat ? deptStat.reportsCompleted : 0;
                const fysSent = fysStat ? fysStat.reportsSent : 0;
                const fysDone = fysStat ? fysStat.reportsCompleted : 0;
                const allSent = overall ? overall.reportsSent : 0;
                const allDone = overall ? overall.reportsCompleted : 0;

                lines.push([
                    semester,
                    session,
                    row.campaignName.trim(),
                    row.studentId,
                    row.facultyId,
                    row.facultyName,
                    row.facultyEmail,
                    row.courseNumber,
                    row.courseName,
                    row.coursePrefix,
                    row.sectionName,
                    row.department,
                    row.isFYS ? 'Yes' : 'No',
                    row.responded ? 'Yes' : 'No',
                    row.responded ? 1 : 0,
                    row.respondedDate,
                    row.notifications,
                    deptSent,
                    deptDone,
                    deptDone > 0 ? 'Yes' : 'No',
                    fysSent,
                    fysDone,
                    fysDone > 0 ? 'Yes' : 'No',
                    allSent,
                    allDone,
                    allDone > 0 ? 'Yes' : 'No'
                ].map(csvCell).join(','));
            });

            // BOM keeps accented names readable when the file is opened in Excel.
            const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = tableauFileName(semester, session);
            link.click();
            URL.revokeObjectURL(link.href);
        }

            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;
            doc.save(`Progress Report Course Analysis_${dateStr}.pdf`);
        }

        function exportCourseAnalysisDeptToPDF(department) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Get current date
            const currentDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            // Add title
            doc.setFontSize(20);
            doc.text(`Course Analysis for ${department}`, 105, 20, { align: 'center' });
            
            // Add date and name
            doc.setFontSize(10);
            doc.text(currentDate, 105, 30, { align: 'center' });
            doc.text('Josh Goldblatt, Academic Affairs', 105, 36, { align: 'center' });
            
            // Get courses for this department
            const courses = [];
            processedData.courseStats.forEach((course, key) => {
                if (course.department === department) {
                    courses.push(course);
                }
            });
            
            courses.sort((a, b) => a.courseNumber.localeCompare(b.courseNumber));
            
            // Calculate department totals
            let totalSent = 0;
            let totalCompleted = 0;
            courses.forEach(course => {
                totalSent += course.reportsSent;
                totalCompleted += course.reportsCompleted;
            });
            const deptRate = totalSent > 0 ? ((totalCompleted / totalSent) * 100).toFixed(1) : '0.0';
            
            // Add department statistics
            doc.setFontSize(12);
            let yPos = 50;
            doc.text(`Total Courses: ${courses.length}`, 20, yPos);
            doc.text(`Reports Sent: ${totalSent}`, 75, yPos);
            doc.text(`Completed: ${totalCompleted}`, 125, yPos);
            doc.text(`Completion Rate: ${deptRate}%`, 160, yPos);
            
            // Prepare table data
            const tableData = courses.map(course => {
                const percentage = course.reportsSent > 0
                    ? ((course.reportsCompleted / course.reportsSent) * 100).toFixed(1)
                    : '0.0';
                return [
                    course.courseNumber,
                    course.courseName,
                    course.reportsSent.toString(),
                    course.reportsCompleted.toString(),
                    `${percentage}%`
                ];
            });
            
            yPos += 15;
            doc.autoTable({
                startY: yPos,
                head: [['Course Number', 'Course Name', 'Reports Sent', 'Reports Completed', 'Completion Rate']],
                body: tableData,
                theme: 'striped',
                headStyles: { 
                    fillColor: [102, 126, 234],
                    fontSize: 10,
                    fontStyle: 'bold',
                    halign: 'left'
                },
                bodyStyles: {
                    fontSize: 9
                },
                columnStyles: {
                    0: { cellWidth: 30 },
                    1: { cellWidth: 65 },
                    2: { cellWidth: 28, halign: 'center' },
                    3: { cellWidth: 32, halign: 'center' },
                    4: { cellWidth: 28, halign: 'center' }
                },
                margin: { left: 20, right: 20 }
            });
            
            // Save the PDF with formatted date and department name
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;
            const deptName = deptFileLabel(department);
            doc.save(`Progress Report Course Analysis_${deptName}_${dateStr}.pdf`);
        }

        function exportAllDepartmentsPDF() {
            // Get all departments
            const departments = new Set();
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                departments.add(faculty.department);
            });
            const sortedDepts = sortDepartmentKeys(departments);

            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;

            // Create zip file with all department PDFs
            const zip = new JSZip();
            sortedDepts.forEach(dept => {
                const pdfBlob = exportDepartmentToPDF(dept, true);
                const deptName = deptFileLabel(dept);
                zip.file(`Progress Report Participation_${deptName}_${dateStr}.pdf`, pdfBlob);
            });

            zip.generateAsync({ type: 'blob' }).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Progress Report All Departments_${dateStr}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
            });
        }

        function exportNonRespondentsCSV(department, returnContent) {
            // Get faculty in this department who completed 0 reports
            const nonRespondents = [];
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                if (faculty.department === department && faculty.reportsCompleted === 0) {
                    nonRespondents.push(faculty);
                }
            });

            // Sort by name
            nonRespondents.sort((a, b) => a.name.localeCompare(b.name));

            if (nonRespondents.length === 0) {
                if (!returnContent) {
                    alert(`No non-respondents found for ${department}. All faculty in this department have completed at least one report.`);
                }
                return null;
            }

            // Build CSV content
            let csv = 'Faculty Name,Email,Department,Reports Sent\n';
            nonRespondents.forEach(faculty => {
                // Escape fields that might contain commas
                const name = `"${faculty.name.replace(/"/g, '""')}"`;
                const email = `"${(faculty.email || '').replace(/"/g, '""')}"`;
                const dept = `"${faculty.department.replace(/"/g, '""')}"`;
                csv += `${name},${email},${dept},${faculty.reportsSent}\n`;
            });

            // If returnContent is true, return CSV string for zipping
            if (returnContent) {
                return csv;
            }

            // Otherwise trigger direct download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;
            const deptName = deptFileLabel(department);
            link.href = URL.createObjectURL(blob);
            link.download = `Non-Respondents_${deptName}_${dateStr}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function exportAllNonRespondentsCSV() {
            // Get all departments
            const departments = new Set();
            processedData.facultyDepartmentStats.forEach((faculty, key) => {
                departments.add(faculty.department);
            });
            const sortedDepts = sortDepartmentKeys(departments);

            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            const dateStr = `${month}.${day}.${year}`;

            // Create zip file with all department CSVs
            const zip = new JSZip();
            let hasAny = false;
            sortedDepts.forEach(dept => {
                const csvContent = exportNonRespondentsCSV(dept, true);
                if (csvContent) {
                    const deptName = deptFileLabel(dept);
                    zip.file(`Non-Respondents_${deptName}_${dateStr}.csv`, csvContent);
                    hasAny = true;
                }
            });

            if (!hasAny) {
                alert('No non-respondents found in any department. All faculty have completed at least one report.');
                return;
            }

            zip.generateAsync({ type: 'blob' }).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Non-Respondents All Departments_${dateStr}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
            });
        }
    </script>
